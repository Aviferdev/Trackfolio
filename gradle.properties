#Kotlin Native
kotlin.native.ignoreDisabledTargets=true
# navigation-compose (todas las versiones hasta 2.8.x) declara getBackStackEntry
# como función inline. El compilador Kotlin/Native 2.3.x no puede serializar esa
# función en su caché de librerías y falla con IllegalStateException.
# Deshabilitar la caché evita el problema sin tocar el código de navegación.
# Impacto: la primera compilación de iosArm64 tarda más; las incrementales no.
# Issue de referencia: https://kotl.in/issue (buscar "getBackStackEntry inline cache")
kotlin.native.cacheKind.iosArm64=none
kotlin.native.cacheKind=none
kotlin.native.incremental=false

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true